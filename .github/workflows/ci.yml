name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: swift-format (lint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests

  test-macos:
    name: Build & test (macOS, portable core)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift build
      - run: swift test

  test-ios:
    name: Build & test (iOS Simulator, full surface)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick a simulator (resolve a concrete UDID)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' \
                 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Baseplate-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation

  docs:
    name: DocC build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build documentation
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme Baseplate \
            -destination 'generic/platform=iOS Simulator'
